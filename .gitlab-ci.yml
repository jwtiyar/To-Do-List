image: eclipse-temurin:17-jdk

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  ANDROID_HOME: $CI_PROJECT_DIR/android-sdk

cache:
  key:
    files:
      - '**/*.gradle*'
      - '**/gradle.properties'
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - android-sdk/

stages:
  - lint
  - test
  - build
  - release

before_script:
  # Install Android SDK if not already cached
  - apt-get update -qq && apt-get install -y -qq wget unzip
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
      echo "Downloading Android Command Line Tools..."
      mkdir -p $ANDROID_HOME/cmdline-tools
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
      unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/
      mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
      rm cmdline-tools.zip
    fi
  - echo "Accepting all Android SDK Licenses..."
  - yes | sdkmanager --licenses > /dev/null || true
  - echo "Bootstrapping core Android SDK components..."
  - sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
  - chmod +x ./gradlew

# -----------------
# PUSH TO BRANCHES
# -----------------

lint:
  stage: lint
  script:
    - ./gradlew lintFdroidDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/lint-results-*.html
  rules:
    - if: $CI_COMMIT_BRANCH

unit_tests:
  stage: test
  script:
    - ./gradlew testFdroidDebugUnitTest
  artifacts:
    when: always
    reports:
      junit: app/build/reports/tests/testFdroidDebugUnitTest/*.xml
  rules:
    - if: $CI_COMMIT_BRANCH

build_debug:
  stage: build
  script:
    - ./gradlew assembleFdroidDebug
  artifacts:
    paths:
      - app/build/outputs/apk/fdroid/debug/*.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# -----------------
# RELEASE ON TAG v*
# -----------------

build_release:
  stage: build
  script:
    # Setup keystore securely
    - mkdir -p keystore
    - echo "$KEYSTORE_BASE64" | base64 -d > keystore/simplertask-release.jks
    - echo "storeFile=$CI_PROJECT_DIR/keystore/simplertask-release.jks" > keystore.properties
    - echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
    - echo "keyAlias=$KEY_ALIAS" >> keystore.properties
    - echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
    # Build APK
    - ./gradlew assembleFdroidRelease
  artifacts:
    paths:
      - app/build/outputs/apk/fdroid/release/*.apk
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_release
      artifacts: true
  script:
    - |
      apk add --no-cache curl
      # Find the signed APK
      export APK_FILE=$(find app/build/outputs/apk/fdroid/release -name "*release.apk" | head -1)
      if [ -z "$APK_FILE" ]; then
        echo "ERROR: APK file not found!"
        exit 1
      fi
      export APK_NAME=$(basename "$APK_FILE")
      export PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${CI_COMMIT_TAG}/${APK_NAME}"
      echo "Targeting APK: $APK_NAME"
      echo "Uploading to Registry..."
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$APK_FILE" "$PACKAGE_URL"
      echo "Creating GitLab Release entry..."
      release-cli create --name "Release $CI_COMMIT_TAG" \
        --description "Autogenerated release for $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --assets-link "{\"name\":\"${APK_NAME}\",\"url\":\"${PACKAGE_URL}\"}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
