image: eclipse-temurin:17-jdk

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

cache:
  key:
    files:
      - '**/*.gradle*'
      - '**/gradle.properties'
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

stages:
  - lint
  - test
  - build
  - release

before_script:
  # Grant execute permissions to gradlew
  - chmod +x ./gradlew

# -----------------
# PUSH TO BRANCHES
# -----------------

lint:
  stage: lint
  script:
    - ./gradlew lintFdroidDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/lint-results-*.html
  rules:
    - if: $CI_COMMIT_BRANCH

unit_tests:
  stage: test
  script:
    - ./gradlew testFdroidDebugUnitTest
  artifacts:
    when: always
    reports:
      junit: app/build/reports/tests/testFdroidDebugUnitTest/*.xml
  rules:
    - if: $CI_COMMIT_BRANCH

build_debug:
  stage: build
  script:
    - ./gradlew assembleFdroidDebug
  artifacts:
    paths:
      - app/build/outputs/apk/fdroid/debug/*.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# -----------------
# RELEASE ON TAG v*
# -----------------

build_release:
  stage: build
  script:
    # Setup keystore securely
    - mkdir -p keystore
    - echo "$KEYSTORE_BASE64" | base64 -d > keystore/simplertask-release.jks
    - echo "storeFile=$CI_PROJECT_DIR/keystore/simplertask-release.jks" > keystore.properties
    - echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
    - echo "keyAlias=$KEY_ALIAS" >> keystore.properties
    - echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
    # Build APK
    - ./gradlew assembleFdroidRelease
  artifacts:
    paths:
      - app/build/outputs/apk/fdroid/release/*.apk
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_release
      artifacts: true
  script:
    - |
      apk add --no-cache curl
      export APK_FILE=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | head -1)
      export APK_NAME=$(basename "$APK_FILE")
      export PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${CI_COMMIT_TAG}/${APK_NAME}"
      echo "Uploading $APK_NAME to Registry..."
      curl --verbose --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$APK_FILE" "$PACKAGE_URL"
      echo "Creating GitLab Release..."
      release-cli create --name "Release $CI_COMMIT_TAG" --description "Autogenerated release for $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --assets-link "{\"name\":\"${APK_NAME}\",\"url\":\"${PACKAGE_URL}\"}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
